# Server
server.port=8080

# H2 Database (stores contact submissions)
spring.datasource.url=jdbc:h2:file:./data/toplisting
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mail (configure your SMTP before going live)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Notification email — who receives the contact form leads
app.notification.email=hello@toplisting.com

# Allowed frontend origins
app.cors.allowed-origins=http://localhost:4200,https://toplisting.com
