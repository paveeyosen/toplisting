# Production profile — values injected as Railway env vars
server.port=${PORT:8080}

# PostgreSQL (add a Postgres plugin in Railway, it sets DATABASE_URL automatically)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Mail — set these as Railway env vars
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.notification.email=${NOTIFICATION_EMAIL:hello@toplisting.com}
app.cors.allowed-origins=${CORS_ORIGINS:https://toplisting.vercel.app,https://toplisting.com}
